<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Dennis Kabaso</title>
    <meta name="description" content="This address is not on Dennis Kabaso's site.">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#13140F">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&amp;family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@800&amp;display=swap"
    >
    <style>
      :root {
        --bg: #13140f;
        --text: #fcfdf8;
        --muted: #b7b8b0;
        --lime: #f0f850;
        --display: "Bricolage Grotesque", "Arial Black", Impact, sans-serif;
        --body: "Instrument Sans", "Segoe UI", Helvetica, Arial, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--body);
        font-size: 1.0625rem;
        line-height: 1.6;
      }

      p { margin: 0; }

      a { color: inherit; }

      :focus { outline: none; }

      :focus-visible {
        outline: 3px solid var(--lime);
        outline-offset: 3px;
      }

      .skip-link {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .skip-link:focus {
        position: static;
        width: auto;
        height: auto;
        margin: 0.75rem 0 0 1.25rem;
        padding: 0.7rem 1.1rem;
        overflow: visible;
        clip: auto;
        display: inline-flex;
        background: var(--lime);
        color: var(--bg);
        font-weight: 600;
        text-decoration: none;
        border-radius: 999px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .wrap {
        width: min(1240px, calc(100% - 2.5rem));
        margin-inline: auto;
      }

      .site-header {
        background: var(--bg);
        border-top: 4px solid var(--lime);
        border-bottom: 1px solid #2a2a26;
      }

      .bar {
        display: flex;
        align-items: center;
        min-height: 4.75rem;
      }

      .logo {
        color: var(--text);
        font-family: var(--mono);
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-decoration: none;
      }

      main {
        padding-block: 4.5rem 3rem;
      }

      .kicker span {
        display: inline-flex;
        align-items: center;
        background: var(--lime);
        color: var(--bg);
        border-radius: 999px;
        padding: 0.28rem 0.7rem;
        font-family: var(--mono);
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }

      h1 {
        margin: 1.15rem 0 0;
        max-width: 12ch;
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(3rem, 8vw, 5.5rem);
        letter-spacing: -0.035em;
        line-height: 0.95;
      }

      .lede {
        margin-top: 1.25rem;
        max-width: 36rem;
        color: var(--muted);
        font-size: 1.125rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0.75rem 1.2rem;
        border: 1.5px solid transparent;
        border-radius: 999px;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;
      }

      .button-primary {
        background: var(--lime);
        border-color: var(--lime);
        color: var(--bg);
      }

      .button-primary:hover {
        background: var(--text);
        border-color: var(--text);
      }

      .button-primary:focus-visible {
        outline-color: var(--text);
      }

      .button-secondary {
        background: transparent;
        border-color: var(--text);
        color: var(--text);
      }

      .button-secondary:hover {
        border-color: var(--lime);
        color: var(--lime);
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap bar">
        <a class="logo" href="/">Dennis Kabaso<span class="visually-hidden"> home</span></a>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div class="wrap">
        <p class="kicker"><span>404</span></p>
        <h1>Page not found</h1>
        <p class="lede">This address is not on the site.</p>
        <div class="actions">
          <a class="button button-primary" href="/">Back home</a>
          <a class="button button-secondary" href="/#projects">Projects</a>
          <a class="button button-secondary" href="/#contact">Contact</a>
        </div>
      </div>
    </main>
  </body>
</html>
